

<!---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------->

<section id="2">
  <swiper-container
    slides-per-view="1"
    speed="500"
    navigation="true"
    class="w-full min-h-[100svh] flex items-center justify-center [--swiper-navigation-size:16px] md:[--swiper-navigation-size:22px] [--swiper-theme-color:#F4A7B9] md:[--swiper-navigation-sides-offset:40px]"
  >
    <swiper-slide
      class="relative min-h-[100svh] w-full flex flex-col items-center justify-center gap-4 px-4"
    >
      <!-- USE the story scene as a static background (replace the video with an image) -->
      <img
        src="/background/Blue Illustration Night Desktop Wallpaper.png"
        alt=""
        class="absolute inset-0 w-full h-full object-cover pointer-events-none z-0"
      />
      <a
        href="#1"
        class="fixed top-4 md:top-6 left-1/2 -translate-x-1/2 z-[9999] px-5 md:px-6 py-2 rounded-full text-[10px] md:text-[11px] tracking-[0.3em] uppercase font-medium text-white backdrop-blur-lg border border-white/20 shadow-[0_8px_25px_rgba(0,0,0,0.08)] transition-all duration-500 hover:-translate-y-0.5"
      >
        <span class="relative z-10">EXIT</span>
      </a>

      <div
        #book
        class="shadow-2xl pointer-events-auto overflow-hidden scale-[0.85] sm:scale-90 md:scale-95 lg:scale-100 origin-center"
      ></div>

      <div class="flex gap-3 z-10">
        <button
          (click)="prevPage()"
          class="px-4 py-2 text-[10px] md:text-xs tracking-[0.2em] uppercase font-semibold rounded-full border border-sky-300 text-sky-900 bg-sky-200 hover:bg-sky-300 shadow-md transition-all duration-300 hover:scale-105"
        >
          Prev
        </button>

        <button
          (click)="nextPage()"
          class="px-4 py-2 text-[10px] md:text-xs tracking-[0.2em] uppercase font-semibold rounded-full border border-sky-300 text-sky-900 bg-sky-200 hover:bg-sky-300 shadow-md transition-all duration-300 hover:scale-105"
        >
          Next
        </button>
      </div>
    </swiper-slide>

    <swiper-slide
      class="relative min-h-[100svh] w-full flex items-center justify-center px-4"
    >
      <img
        src="/background/Dark Blue Purple Anime Shooting Star Desktop Wallpaper.png"
        alt=""
        class="absolute inset-0 w-full h-full object-cover pointer-events-none z-0"
      />
      <div class="absolute inset-0 bg-black/30 z-10"></div>
    </swiper-slide>

    <swiper-slide
      class="relative min-h-[100svh] w-full flex items-center justify-center px-4"
    >
      <img
        src="/background/Orange Dark Grey Watercolor Night Sky Linktree Background.png"
        alt=""
        class="absolute inset-0 w-full h-full object-cover pointer-events-none z-0"
      />
      <div class="absolute inset-0 bg-black/40 z-10"></div>

      <div
        class="relative z-10 flex flex-col items-center justify-center text-center"
      >
        <p
          class="text-base sm:text-2xl text-white/90 mb-2 tracking-wide font-semibold drop-shadow-[0_1px_4px_rgba(0,0,0,0.6)]"
        ></p>
      </div>
    </swiper-slide>
  </swiper-container>
</section>
