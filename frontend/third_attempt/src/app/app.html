@if (loading) {
<div
  class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-white text-center px-6"
>
  <img
    src="/assets/ea.gif"
    alt="Loading"
    class="w-32 md:w-40 mb-10 opacity-90"
  />

  <p
    class="text-gray-800 text-2xl md:text-4xl font-medium tracking-wide leading-relaxed max-w-3xl"
  >
    {{ loadingMessage }}
  </p>
</div>
}

<div
  class="fixed top-6 left-6 z-[9998] flex items-center gap-2 group pointer-events-auto"
>
  <!-- Play / Pause (always visible) -->
<button
  (click)="toggleMusic()"
  class="flex items-center gap-2 px-4 py-2 rounded-full
         bg-white/10 backdrop-blur-md
         border border-white/20
         text-white text-sm font-medium
         shadow-[0_8px_30px_rgba(0,0,0,0.35)]
         hover:bg-white/20 hover:border-white/30 hover:scale-105
         transition"
>
  <span class="text-lg leading-none">
    {{ isMusicOn() ? '⏸' : '▶' }}
  </span>

</button>


  <!-- Hidden group -->
  <div
    class="flex items-center gap-2
           opacity-0 scale-95 translate-x-[-6px]
           pointer-events-none
           transition-all duration-200 ease-out
           group-hover:opacity-100
           group-hover:scale-100
           group-hover:translate-x-0
           group-hover:pointer-events-auto"
  >
    <!-- Previous -->
    <button
      (click)="prevTrack()"
      class="w-10 h-10 rounded-full bg-white/80 backdrop-blur-md text-gray-800 shadow-lg
             hover:bg-white hover:scale-105 transition flex items-center justify-center"
      aria-label="Previous track"
    >
      ‹‹
    </button>

    <!-- Next -->
    <button
      (click)="nextTrack()"
      class="w-10 h-10 rounded-full bg-white/80 backdrop-blur-md text-gray-800 shadow-lg
             hover:bg-white hover:scale-105 transition flex items-center justify-center"
      aria-label="Next track"
    >
      ››
    </button>
  </div>
</div>



<div
  class="fixed top-6 right-6 z-[9998]
         flex items-center
         h-9 w-9
         hover:w-[220px] md:hover:w-[300px]
         overflow-visible
         gap-3
         px-2 hover:px-4
         rounded-full
         bg-white/10 backdrop-blur-md
         border border-white/20
         text-white text-xs font-medium
         shadow-[0_12px_40px_rgba(0,0,0,0.45)]
         transition-all duration-300 ease-out
         group"
>
  <!-- icon -->
  <span class="text-sm shrink-0">🎧</span>

  <div
    class="relative
           opacity-0 translate-x-2
           group-hover:opacity-100 group-hover:translate-x-0
           transition-all duration-300"
  >
    <!-- marquee window -->
    <span class="block overflow-hidden max-w-[140px] md:max-w-[200px]">
      <span class="inline-block whitespace-nowrap font-semibold animate-marquee">
        {{ currentSong() }}
      </span>
    </span>

    <!-- tooltip -->
    <span
      class="absolute left-1/2 top-full mt-3
             -translate-x-[70%]
             whitespace-nowrap
             rounded-lg
             bg-black/80 backdrop-blur-md
             px-3 py-1.5 text-xs text-white
             shadow-xl
             opacity-0 scale-95
             transition-all duration-200
             group-hover:opacity-100 group-hover:scale-100
             pointer-events-none"
    >
      Current Song (I adore you <3): {{ currentSong() }}
    </span>
  </div>
</div>
