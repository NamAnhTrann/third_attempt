@if (loading) {
<div
  class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-white text-center px-6"
>
  <img
    src="/assets/ea.gif"
    alt="Loading"
    class="w-32 md:w-40 mb-10 opacity-90"
  />

  <p
    class="text-gray-800 text-2xl md:text-4xl font-medium tracking-wide leading-relaxed max-w-3xl"
  >
    {{ loadingMessage }}
  </p>
</div>
}

<button
  (click)="toggleMusic()"
  class="fixed top-6 left-6 z-[9998] flex items-center gap-2 px-4 py-2 rounded-full bg-white/90 backdrop-blur-md text-gray-800 text-sm font-medium shadow-lg hover:scale-105 transition pointer-events-auto"
>
  <span class="text-lg leading-none">
    {{ isMusicOn() ? "⏸" : "▶" }}
  </span>
  <span class="hidden md:inline">
    {{ isMusicOn() ? "Pause" : "Play" }}
  </span>
</button>
<div
  class="fixed top-6 right-6 z-[9998]
         flex items-center
         h-9 w-9
         hover:w-[220px] md:hover:w-[300px]
         overflow-visible
         gap-3
         px-2 hover:px-4
         rounded-full
         bg-[#121212]/90
         text-white text-xs font-medium
         shadow-[0_12px_40px_rgba(0,0,0,0.6)]
         transition-all duration-300 ease-out
         group"
>
  <!-- icon -->
  <span class="text-sm shrink-0">🎧</span>

  <div
    class="relative
           opacity-0 translate-x-2
           group-hover:opacity-100 group-hover:translate-x-0
           transition-all duration-300"
  >
    <!-- marquee window -->
    <span class="block overflow-hidden max-w-[140px] md:max-w-[200px]">
      <span class="inline-block whitespace-nowrap font-semibold animate-marquee">
        {{ currentSong() }}
      </span>
    </span>

    <!-- tooltip (kept) -->
    <span
      class="absolute left-1/2 top-full mt-3
             -translate-x-[70%]
             whitespace-nowrap
             rounded-lg bg-black
             px-3 py-1.5 text-xs text-white
             shadow-xl
             opacity-0 scale-95
             transition-all duration-200
             group-hover:opacity-100 group-hover:scale-100
             pointer-events-none"
    >
      Current Song: {{ currentSong() }}
    </span>
  </div>
</div>


<router-outlet></router-outlet>
